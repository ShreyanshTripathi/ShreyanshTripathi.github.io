<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — Shreyansh Tripathi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* SHARED STYLES ... (Same as Experience) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #2563eb; --text: #111827; --text-muted: #6b7280; --border: #e5e7eb; --bg: #ffffff; --bg-subtle: #f9fafb; }
    [data-theme="dark"] { --accent: #a78bfa; --text: #ede9fe; --text-muted: #9b8ec4; --border: rgba(139,92,246,0.22); --bg: #0c0a18; --bg-subtle: #15122a; }
    body { font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text); background: var(--bg); padding: 0; margin: 0; }
    nav { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    [data-theme="dark"] nav { background: rgba(12,10,24,0.92); }
    .nav-inner { max-width: 880px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a { color: var(--text-muted); font-size: 14px; font-weight: 500; padding: 6px 12px; text-decoration: none; }
    .nav-links a.nav-download { background: var(--text); color: var(--bg); font-weight: 600; margin-left: 8px; }
  
    .container { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
    
    /* FORM STYLES */
    .contact-form { max-width: 600px; margin: 30px 0; padding: 32px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-subtle); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; }
    .submit-btn { background: var(--accent); color: white; padding: 14px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .submit-btn:hover { opacity: 0.9; }
    #theme-toggle { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <span style="font-weight:700;">Shreyansh Tripathi</span>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="experience.html">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="publications.html">Publications</a>
        <a href="contact.html">Contact</a>
        <a href="ResumeApril2026.pdf" class="nav-download" download>Download CV</a>
        <button id="theme-toggle">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>Get in Touch</h2>
    <p>Feel free to reach out for research collaborations or ML engineering opportunities.</p>
    
    <div class="contact-form">
      <form action="https://formspree.io/f/shreyanshtripathi03@gmail.com" method="POST">
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" placeholder="Shreyansh Tripathi" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="shreyanshtripathi03@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea name="message" rows="5" placeholder="Let's build something..." required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Email</button>
      </form>
    </div>
  </div>

  <script>
    const html = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark') { html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; }
    btn.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      btn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
  </script>
</body>
</html>
